version: 2
project_name: myapp
builds:
  - main: .
    binary: myapp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{.Version}} -X main.commit={{.FullCommit}}
archives:
  - formats: [tar.gz]
    files: [README.md, DEPENDENCIES.md, LICENSE*]
checksum:
  name_template: checksums.txt
release:
  prerelease: auto
changelog:
  sort: asc
